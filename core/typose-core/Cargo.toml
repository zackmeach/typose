[package]
name = "typose-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Parser/sanitizer pins (Rendered Markdown slice §2.3) and image codec pins (images.rs allocation inventory).
ammonia = "=4.2.5"
crc32fast = "=1.5.4"
csv-core = "=0.1.13"
encoding_rs = "=0.8.44"
fdeflate = "=0.3.7"
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
memchr = "=2.8.3"
png = "=0.18.1"
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }
weezl = "=0.1.10"
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
proptest = "=1.12.0"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Pipes"] }

# Plan C1's counting-allocator test: a binary of its own, so its global allocator counts every thread.
[[test]]
name = "ledger"
harness = false

[features]
# Plan m8: the test-hooks addon's behaviour-changing hooks (a per-read delay, debug stats). Never in a release build.
test-hooks = []
