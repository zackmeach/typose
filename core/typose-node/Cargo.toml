[package]
name = "typose-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
# Its tests are JavaScript (app/core-host/*.test.ts): a Rust test binary would need Node's napi symbols to link.
test = false
doctest = false

[dependencies]
napi = "=3.14.2"
napi-derive = "=3.6.12"
# Not used directly: napi-derive's codegen. 6.1.6 emits calls that only napi 3.15 has.
napi-derive-backend = "=6.1.5"
typose-core = { path = "../typose-core" }
toml_edit = "=0.25.19"
serde_json = "=1.0.154"

[build-dependencies]
napi-build = "=2.6.0"

[features]
# Plan m8: builds the test-hooks addon (`npm run build:addon:hooks`), with a per-read delay and debug stats.
test-hooks = ["typose-core/test-hooks"]
