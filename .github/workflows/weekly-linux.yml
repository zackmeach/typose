# The full e2e suite on Linux once a week (Z85), while the repo is private. It no longer fits pr.yml's time box (run
# 41257236662 hit 25 minutes); per-PR runs are a smoke subset. A red run is fixed in the next PR. `workflow_dispatch`
# runs it on demand, or on a branch (`gh workflow run weekly-linux.yml --ref <branch>`).
name: weekly-linux

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC, an hour after main-macos, on the default branch
  workflow_dispatch:

# Runs on one branch share a group, and a newer one cancels the older: only the latest state of a branch matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # about 45 minutes of e2e after setup, with room for the evidence upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rust
        name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          cache-bin: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Cache the Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - id: deps
        run: npm ci
      # From here each step runs when what it needs succeeded, so one failure doesn't hide the others.
      # Electron 44 installs no binary at `npm ci`; the first require('electron') fetches it. Fetch it here, from the
      # cache when warm, so the e2e step times only the e2e.
      - id: electron
        name: Electron binary
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npx --no install-electron
      - id: napi
        name: napi build (before the typecheck, which reads the addon's generated types)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build:addon
      - name: cargo test
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo test --locked
        working-directory: core
      - name: Vendored JPEG strictness regressions
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo test --locked -p zune-jpeg --lib
        working-directory: core
      - name: npm run check
        if: ${{ !cancelled() && steps.napi.outcome == 'success' }}
        run: npm run check
      - id: build
        name: npm run build
        if: ${{ !cancelled() && steps.napi.outcome == 'success' }}
        run: npm run build
      # Before the package step, so core/typose-node/hooks/ exists when it packages: packaged.e2e.ts then checks
      # that the package leaves it out (plan m8).
      - name: npm run test:hooks (builds the test-hooks addon, then its Rust and napi tests)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: npm run test:hooks
      - id: package
        name: Package the fused --dir build (packaged.e2e.ts drives it)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run package
      - name: e2e and the NetLog assertion (full suite, under xvfb, with the sandbox on)
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.electron.outcome == 'success' }}
        timeout-minutes: 45 # past the longest test's own limit (10 min, large and long-line; the config's is 5)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run e2e
      # Failure evidence (plan C9): kept 5 days, for the orchestrator to copy into .evidence/m1/ci/ before it expires.
      - name: Collect the failure evidence (bounded)
        if: failure()
        run: node .github/scripts/collect-evidence.mjs "${{ runner.temp }}/evidence"
      - name: Upload the failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 5
          compression-level: 9
          include-hidden-files: true
          if-no-files-found: ignore
