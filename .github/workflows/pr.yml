# The full e2e suite on Windows, Linux and macOS for every non-draft PR and every push to main; drafts never run. Green CI
# is the merge bar. The repo is public, so hosted minutes are free: each OS splits the suite into four shards that run
# in parallel. Caches are keyed per lockfile and OS, docs-only changes are skipped, a newer push to a PR cancels its
# older run, fmt and lint run on Linux only, every job is time-boxed, and bounded evidence is kept only on failure.
# `workflow_dispatch` runs it on a branch
# without a PR (`gh workflow run pr.yml --ref <branch>`), optionally only the e2e tests it names, so a platform fix can
# be checked cheaply.
name: pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # GitHub judges a PR's whole diff against its base, not the latest push: a docs-only push to a PR that changes
    # code still runs. `*.md` is the root's own (README and the like); Markdown under app/, core/ and e2e/ is test input.
    paths-ignore: ['docs/**', '*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      grep:
        description: Run only the e2e tests whose title matches this regular expression (Playwright --grep)
        required: false
        default: ''
      repeat-each:
        description: Run each of them this many times (Playwright --repeat-each)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }} # so a dispatch on main never displaces a push's run
  cancel-in-progress: ${{ github.event_name != 'push' }} # a running push to main finishes; one still waiting gives way to a newer merge

permissions:
  contents: read

jobs:
  # Platform-independent checks, on Linux only. Each check runs even when an earlier check failed, so one run reports
  # them all; a failed setup step still skips everything after it.
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rust
        name: Rust (the toolchain rust-toolchain.toml pins), plus the Windows target for clippy
        run: rustup toolchain install && rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          cache-bin: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: deps
        run: npm ci
      - name: cargo fmt --check
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo fmt --check
        working-directory: core
      - name: clippy
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: core
      - name: clippy for the Windows target (its cfg(windows) code, without paying for a Windows runner)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
        working-directory: core
      - name: clippy with the test-hooks feature (the test-hooks addon's code, plan m8)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --all-targets --locked --features typose-node/test-hooks -- -D warnings
        working-directory: core
      - name: cargo deny (advisories, sources and bans for the Rust dependencies; core/deny.toml)
        if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: core/Cargo.toml
          command: check advisories sources bans
      - name: oxlint (app, e2e and .github/scripts)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint -- .github/scripts

  test:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4] # shard-count and the label below must change with this list
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ matrix.os }}
      # Measured on the first full runs: Linux e2e is 1.2 to 3.9 minutes a shard (about 10 in total), the longest macOS
      # shard 7.7, and setup to the start of e2e 1.5 to 3.5. rendered-memory runs on Linux and adds about 11 minutes to
      # one shard there. Shards are uneven because Playwright splits by test file, and a retry re-runs a failed test.
      job-timeout: 120 # DIAG: 1,200 Windows launches; the e2e step's 30 after the setup and unit layers, with room for the evidence upload
      e2e-timeout: 100 # DIAG; the longest measured e2e step is 12.3 minutes; past the longest test's own limit (10 min, large and long-line; the config's is 5)
      e2e-script: e2e
      e2e-label: ${{ inputs.grep && 'named tests' || format('full suite, shard {0}/4', matrix.shard) }}
      shard: ${{ !inputs.grep && matrix.shard || '' }} # a dispatch that names tests runs them unsharded, so a grep that matches nothing fails
      shard-count: '4'
      unit-tests: ${{ matrix.shard == 1 }} # the unit layers, and a grep dispatch's e2e, run once per OS
      package-name: ${{ matrix.os == 'macos-latest' && 'Package the fused --dir build, the arm64 .app (packaged.e2e.ts drives it)' || 'Package the fused --dir build (packaged.e2e.ts drives it)' }}
      grep: ${{ inputs.grep }}
      repeat-each: ${{ inputs.repeat-each }}
