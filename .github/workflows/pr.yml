# The full e2e suite on Windows, Linux and macOS for every non-draft PR; drafts never run. Green CI is the merge bar. The
# repo is public, so hosted minutes are free: each OS splits the suite into four shards that run in parallel. Caches are
# keyed per lockfile and OS, docs-only PRs are skipped, a newer push cancels the older run, fmt and lint run on Linux
# only, every job is time-boxed, and bounded evidence is kept only on failure. `workflow_dispatch` runs it on a branch
# without a PR (`gh workflow run pr.yml --ref <branch>`), optionally only the e2e tests it names, so a platform fix can
# be checked cheaply.
name: pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # GitHub judges a PR's whole diff against its base, not the latest push: a docs-only push to a PR that changes
    # code still runs. `*.md` is the root's own (README and the like); Markdown under app/, core/ and e2e/ is test input.
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      grep:
        description: Run only the e2e tests whose title matches this regular expression (Playwright --grep)
        required: false
        default: ''
      repeat-each:
        description: Run each of them this many times (Playwright --repeat-each)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Platform-independent checks, on Linux only. Each check runs even when an earlier check failed, so one run reports
  # them all; a failed setup step still skips everything after it.
  lint:
    if: ${{ !github.event.pull_request.draft }} # a dispatch has no pull_request, so its draft is null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rust
        name: Rust (the toolchain rust-toolchain.toml pins), plus the Windows target for clippy
        run: rustup toolchain install && rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          cache-bin: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: deps
        run: npm ci
      - name: cargo fmt --check
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo fmt --check
        working-directory: core
      - name: clippy
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: core
      - name: clippy for the Windows target (its cfg(windows) code, without paying for a Windows runner)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
        working-directory: core
      - name: clippy with the test-hooks feature (the test-hooks addon's code, plan m8)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --all-targets --locked --features typose-node/test-hooks -- -D warnings
        working-directory: core
      - name: oxlint (app, e2e and .github/scripts)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint -- .github/scripts

  test:
    if: ${{ !github.event.pull_request.draft }} # a dispatch has no pull_request, so its draft is null
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ matrix.os }}
      # Assumes a quarter of the full suite is at most about 15 minutes on the slowest OS (macOS), shards being uneven
      # because Playwright splits by test file; the whole suite is about 45 minutes serial on Linux. Setup and build
      # take about 10 minutes, and shard 1 adds the unit layers. A retry (config: one under CI) re-runs a failed test.
      job-timeout: 50 # the e2e step's 30 after the setup and unit layers, with room for the evidence upload
      e2e-timeout: 30 # twice the quarter-suite estimate; past the longest test's own limit (10 min, large and long-line; the config's is 5)
      e2e-script: e2e
      e2e-label: full suite, shard ${{ matrix.shard }}/4
      shard: ${{ matrix.shard }}
      shard-count: '4'
      unit-tests: ${{ matrix.shard == 1 }} # the unit layers run once per OS
      package-name: ${{ matrix.os == 'macos-latest' && 'Package the fused --dir build, the arm64 .app (packaged.e2e.ts drives it)' || 'Package the fused --dir build (packaged.e2e.ts drives it)' }}
      grep: ${{ inputs.grep }}
      repeat-each: ${{ inputs.repeat-each }}
