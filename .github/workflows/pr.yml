# Windows and Linux on every non-draft PR (Z60); drafts never run. The e2e step is a smoke subset (`npm run e2e:smoke`,
# Z85): the merge bar is the full local Windows gate, and the full Linux suite runs weekly (weekly-linux.yml). Within
# GitHub Free's included minutes and its 500 MB of artifact storage (Z61, plan PR 2): caches keyed per lockfile and OS,
# docs-only PRs skipped, a newer push cancelling the older run, fmt and lint on Linux only, every job time-boxed, and
# bounded evidence only on failure.
name: pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # GitHub judges a PR's whole diff against its base, not the latest push: a docs-only push to a PR that changes
    # code still runs. `*.md` is the root's own (README and the like); Markdown under app/, core/ and e2e/ is test input.
    paths-ignore: ['docs/**', '*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Platform-independent checks, on Linux only. Each check runs even when an earlier check failed, so one run reports
  # them all; a failed setup step still skips everything after it.
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rust
        name: Rust (the toolchain rust-toolchain.toml pins), plus the Windows target for clippy
        run: rustup toolchain install && rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          cache-bin: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: deps
        run: npm ci
      - name: cargo fmt --check
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo fmt --check
        working-directory: core
      - name: clippy
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: core
      - name: clippy for the Windows target (its cfg(windows) code, without paying for a Windows runner)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
        working-directory: core
      - name: clippy with the test-hooks feature (the test-hooks addon's code, plan m8)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --all-targets --locked --features typose-node/test-hooks -- -D warnings
        working-directory: core
      - name: oxlint (app, e2e and .github/scripts)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint -- .github/scripts

  test:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ matrix.os }}
      job-timeout: 25 # the smoke e2e allows 8 minutes after setup, with room for the evidence upload
      e2e-timeout: 8 # the smoke is about a minute and a half of tests; the rest is the hooks build
      e2e-script: e2e:smoke
      e2e-label: smoke
