# Windows and Linux on every non-draft PR (Z60); drafts never run. Within GitHub Free's included minutes and its
# 500 MB of artifact storage (Z61, plan PR 2): caches keyed per lockfile and OS, docs-only PRs skipped, a newer push
# cancelling the older run, fmt and lint on Linux only, every job time-boxed, and bounded evidence only on failure.
name: pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # GitHub judges a PR's whole diff against its base, not the latest push: a docs-only push to a PR that changes
    # code still runs. `*.md` is the root's own (README and the like); Markdown under app/, core/ and e2e/ is test input.
    paths-ignore: ['docs/**', '*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Platform-independent checks, on Linux only. Each check runs even when an earlier check failed, so one run reports
  # them all; a failed setup step still skips everything after it.
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rust
        name: Rust (the toolchain rust-toolchain.toml pins), plus the Windows target for clippy
        run: rustup toolchain install && rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          cache-bin: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: deps
        run: npm ci
      - name: cargo fmt --check
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo fmt --check
        working-directory: core
      - name: clippy
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: core
      - name: clippy for the Windows target (its cfg(windows) code, without paying for a Windows runner)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
        working-directory: core
      - name: oxlint (app, e2e and .github/scripts)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint -- .github/scripts

  test:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25 # the e2e step's 12 after a cold ~5-minute setup, with room left for the evidence upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rust
        name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          cache-bin: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Cache the Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - id: deps
        run: npm ci
      # From here each step runs when what it needs succeeded, so one failure doesn't hide the others.
      # Electron 44 installs no binary at `npm ci`; the first require('electron') fetches it. Fetch it here, from the
      # cache when warm, so the e2e step times only the e2e.
      - id: electron
        name: Electron binary
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npx --no install-electron
      - id: napi
        name: napi build (before the typecheck, which reads the addon's generated types)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build:addon
      - name: cargo test
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo test --locked
        working-directory: core
      - name: npm run check
        if: ${{ !cancelled() && steps.napi.outcome == 'success' }}
        run: npm run check
      - id: build
        name: npm run build
        if: ${{ !cancelled() && steps.napi.outcome == 'success' }}
        run: npm run build
      - name: e2e and the NetLog assertion (Linux, under xvfb, with the sandbox on)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.electron.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 12 # past the longest test's own limit (10 min, large and long-line; the config's is 5)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run e2e
      - name: e2e and the NetLog assertion (Windows)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.electron.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 12 # past the longest test's own limit (10 min, large and long-line; the config's is 5)
        run: npm run e2e
      # Failure evidence (plan C9): kept 5 days, for the orchestrator to copy into .evidence/m1/ci/ before it expires.
      - name: Collect the failure evidence (bounded)
        if: failure()
        run: node .github/scripts/collect-evidence.mjs "${{ runner.temp }}/evidence"
      - name: Upload the failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 5
          compression-level: 9
          include-hidden-files: true
          if-no-files-found: ignore
