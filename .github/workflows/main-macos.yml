# macOS on main once a week, while the repo is private (Z60, made weekly by Z65: macOS minutes bill 10x). A red run is
# fixed in the next PR. `workflow_dispatch` checks main after a macOS-sensitive merge, or a macOS fix on its branch before
# merge (`gh workflow run main-macos.yml --ref <branch>`).
# Hardened as pr.yml is (plan PR 2): caches, a time box, and bounded evidence only on failure.
name: main-macos

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC, on the default branch
  workflow_dispatch:
    # A dispatch can run only the e2e tests it names, so checking a macOS fix costs what those tests take. The weekly
    # run has no inputs, so it runs the whole suite but rendered-memory (Z94).
    inputs:
      grep:
        description: Run only the e2e tests whose title matches this regular expression (Playwright --grep)
        required: false
        default: ''
      repeat-each:
        description: Run each of them this many times (Playwright --repeat-each)
        required: false
        default: ''

# Runs on one branch share a group, and a newer one cancels the older: only the latest state of a branch matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      os: macos-latest
      job-timeout: 23 # the e2e step's 15 after a ~1-minute setup, with room left for the evidence upload
      e2e-timeout: 15 # past the longest test's own limit (10 min, large and long-line; the config's is 5)
      e2e-script: e2e
      electron-cache-path: ~/Library/Caches/electron
      package-name: Package the fused --dir build, the arm64 .app (packaged.e2e.ts drives it)
      grep: ${{ inputs.grep }}
      repeat-each: ${{ inputs.repeat-each }}
      skip-rendered-memory: true
