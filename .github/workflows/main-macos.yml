# macOS on merges to main only, while the repo is private (Z60). A red run is fixed in the next PR.
# `workflow_dispatch` lets a macOS fix be checked on its branch before merge (`gh workflow run main-macos.yml --ref <branch>`).
# Hardened as pr.yml is (plan PR 2): macOS minutes bill 10x, so caches, a docs-only skip, a time box, and bounded
# evidence only on failure. Every merge keeps its own run, so a red one names its merge (Z60: fixed in the next PR).
name: main-macos

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md'] # as pr.yml; for a push, GitHub judges only the pushed commits
  workflow_dispatch:
    # A dispatch can run only the e2e tests it names, so checking a macOS fix costs what those tests take. A push to
    # main has no inputs, so it runs the whole suite.
    inputs:
      grep:
        description: Run only the e2e tests whose title matches this regular expression (Playwright --grep)
        required: false
        default: ''
      repeat-each:
        description: Run each of them this many times (Playwright --repeat-each)
        required: false
        default: ''

# A push to main gets a group of its own (its sha), so a later merge neither cancels it nor replaces it while it waits.
# Manual runs on one branch share a group, and a newer one cancels the older.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20 # the e2e step's 12 after a ~1-minute setup, with room left for the evidence upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rust
        name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          cache-bin: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Cache the Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - id: deps
        run: npm ci
      # From here each step runs when what it needs succeeded, so one failure doesn't hide the others.
      # Electron 44 installs no binary at `npm ci`; the first require('electron') fetches it. Fetch it here, from the
      # cache when warm, so the e2e step times only the e2e.
      - id: electron
        name: Electron binary
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npx --no install-electron
      - id: napi
        name: napi build (before the typecheck, which reads the addon's generated types)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build:addon
      - name: cargo test (not on a dispatch that names its e2e tests)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && !inputs.grep }}
        run: cargo test --locked
        working-directory: core
      - name: npm run check
        if: ${{ !cancelled() && steps.napi.outcome == 'success' }}
        run: npm run check
      - id: build
        name: npm run build
        if: ${{ !cancelled() && steps.napi.outcome == 'success' }}
        run: npm run build
      # Before the package step, so core/typose-node/hooks/ exists when it packages: packaged.e2e.ts then checks
      # that the package leaves it out (plan m8).
      - name: npm run test:hooks (builds the test-hooks addon, then its Rust and napi tests)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: npm run test:hooks
      - id: package
        name: Package the fused --dir build, the arm64 .app (packaged.e2e.ts drives it)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run package
      - name: e2e and the NetLog assertion
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.electron.outcome == 'success' }}
        timeout-minutes: 12 # past the longest test's own limit (10 min, large and long-line; the config's is 5)
        env: # through the environment, never pasted into the script
          GREP: ${{ inputs.grep }}
          REPEAT_EACH: ${{ inputs.repeat-each }}
        run: npm run e2e -- ${GREP:+--grep "$GREP"} ${REPEAT_EACH:+--repeat-each "$REPEAT_EACH"}
      # Every launch should have exited by now; one that didn't is evidence too (run 40067408502 left one hanging).
      - name: Electron and Typose processes still running
        if: failure()
        run: ps -axo pid,ppid,stat,etime,command | grep -E 'Electron\.app|Typose\.app' || true
      # Failure evidence (plan C9): kept 5 days, for the orchestrator to copy into .evidence/m1/ci/ before it expires.
      - name: Collect the failure evidence (bounded)
        if: failure()
        run: node .github/scripts/collect-evidence.mjs "${{ runner.temp }}/evidence"
      - name: Upload the failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 5
          compression-level: 9
          include-hidden-files: true
          if-no-files-found: ignore
