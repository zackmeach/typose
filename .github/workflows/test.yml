# The build-and-test job for one OS and one shard of the e2e suite. pr.yml calls it per matrix cell and keeps its
# triggers, concurrency, matrix and the reasons for its numbers (see the comments beside its `with:`); this file is the steps.
name: test

on:
  workflow_call:
    inputs:
      os:
        description: The runner label
        type: string
        required: true
      job-timeout:
        description: Minutes for the whole job
        type: number
        required: true
      e2e-timeout:
        description: Minutes for the e2e step
        type: number
        required: true
      e2e-script:
        description: The npm script that runs the e2e tests (e2e for the full suite)
        type: string
        required: true
      e2e-label:
        description: Names the e2e step (full suite, shard n/4)
        type: string
        default: ''
      electron-cache-path:
        description: Where this OS keeps the Electron binary
        type: string
        default: |
          ~/.cache/electron
          ~/AppData/Local/electron/Cache
          ~/Library/Caches/electron
      package-name:
        description: Names the package step
        type: string
        default: Package the fused --dir build (packaged.e2e.ts drives it)
      grep:
        description: Run only the e2e tests whose title matches this regular expression (Playwright --grep). Also skips cargo test.
        type: string
        default: ''
      repeat-each:
        description: Run each of them this many times (Playwright --repeat-each)
        type: string
        default: ''
      shard:
        description: This job's shard of the e2e suite, 1-based (Playwright --shard shard/shard-count); empty runs it all
        type: string
        default: ''
      shard-count:
        description: How many shards the suite is split into
        type: string
        default: ''
      unit-tests:
        description: Run the unit layers (cargo test, the vendored JPEG tests, npm run check, test:hooks). A run that sets grep runs its e2e only when this is true, so the shards of one OS run the named tests once
        type: boolean
        default: true
      installer:
        description: On Windows, build the installer and zip from the packaged build, then install, check and uninstall it (.github/scripts/install-check.ps1)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.job-timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rust
        name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          cache-bin: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Cache the Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.electron-cache-path }}
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - id: deps
        run: npm ci
      # From here each step runs when what it needs succeeded, so one failure doesn't hide the others.
      # Electron 44 installs no binary at `npm ci`; the first require('electron') fetches it. Fetch it here, from the
      # cache when warm, so the e2e step times only the e2e.
      - id: electron
        name: Electron binary
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npx --no install-electron
      - id: napi
        name: napi build (before the typecheck, which reads the addon's generated types)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build:addon
      # A dispatch that names its e2e tests skips the two cargo test steps; every other run has no grep.
      - name: cargo test${{ inputs.grep && ' (not on a dispatch that names its e2e tests)' || '' }}
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && inputs.unit-tests && !inputs.grep }}
        run: cargo test --locked
        working-directory: core
      - name: Vendored JPEG strictness regressions
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && inputs.unit-tests && !inputs.grep }}
        run: cargo test --locked -p zune-jpeg --lib
        working-directory: core
      - name: npm run check
        if: ${{ !cancelled() && steps.napi.outcome == 'success' && inputs.unit-tests }}
        run: npm run check
      - id: build
        name: npm run build
        if: ${{ !cancelled() && steps.napi.outcome == 'success' }}
        run: npm run build
      # Before the package step, so core/typose-node/hooks/ exists when it packages: packaged.e2e.ts then checks
      # that the package leaves it out (plan m8). A shard that skips the unit layers still builds the hooks addon.
      - name: npm run test:hooks (builds the test-hooks addon, then its Rust and napi tests)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.rust.outcome == 'success' && inputs.unit-tests }}
        run: npm run test:hooks
      - name: npm run build:addon:hooks (this shard skips the unit layers, so test:hooks doesn't build it)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.unit-tests }}
        run: npm run build:addon:hooks
      - id: package
        name: ${{ inputs.package-name }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run package
      # Before the e2e, which can leave a Typose running that the installer would find. The installer and zip wrap the
      # build the step above packaged (electron-builder --prepackaged), so they ship what the e2e drives.
      - id: installer
        name: The Windows installer and zip, from that build
        if: ${{ !cancelled() && steps.package.outcome == 'success' && inputs.installer }}
        run: npm run installer --workspace typose
      - name: Install, check the Open with registration, launch, uninstall
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: ./.github/scripts/install-check.ps1
      # Inputs reach the script through the environment, never pasted into it.
      - name: e2e ${{ inputs.e2e-label }} and the NetLog assertion (Linux, under xvfb, with the sandbox on)
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.electron.outcome == 'success' && (!inputs.grep || inputs.unit-tests) && runner.os == 'Linux' }}
        timeout-minutes: ${{ inputs.e2e-timeout }}
        env:
          E2E_SCRIPT: ${{ inputs.e2e-script }}
          GREP: ${{ inputs.grep }}
          SHARD: ${{ inputs.shard && format('{0}/{1}', inputs.shard, inputs.shard-count) || '' }}
          REPEAT_EACH: ${{ inputs.repeat-each }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run "$E2E_SCRIPT" -- ${GREP:+--grep "$GREP"} ${SHARD:+--shard "$SHARD"} ${REPEAT_EACH:+--repeat-each "$REPEAT_EACH"}
      - name: e2e ${{ inputs.e2e-label }} and the NetLog assertion (${{ runner.os }})
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.electron.outcome == 'success' && (!inputs.grep || inputs.unit-tests) && runner.os != 'Linux' }}
        timeout-minutes: ${{ inputs.e2e-timeout }}
        shell: bash # the expansions below are bash; Windows runners default to pwsh
        env: # through the environment, never pasted into the script
          E2E_SCRIPT: ${{ inputs.e2e-script }}
          GREP: ${{ inputs.grep }}
          SHARD: ${{ inputs.shard && format('{0}/{1}', inputs.shard, inputs.shard-count) || '' }}
          REPEAT_EACH: ${{ inputs.repeat-each }}
        run: npm run "$E2E_SCRIPT" -- ${GREP:+--grep "$GREP"} ${SHARD:+--shard "$SHARD"} ${REPEAT_EACH:+--repeat-each "$REPEAT_EACH"}
      # Every launch should have exited by now; one that didn't is evidence too (run 40067408502 left one hanging).
      - name: Electron and Typose processes still running
        if: failure() && runner.os == 'macOS'
        run: ps -axo pid,ppid,stat,etime,command | grep -E 'Electron\.app|Typose\.app' || true
      # Failure evidence (plan C9): kept 5 days, for the orchestrator to copy into .evidence/m1/ci/ before it expires.
      - name: Collect the failure evidence (bounded)
        if: failure()
        run: node .github/scripts/collect-evidence.mjs "${{ runner.temp }}/evidence"
      - name: Upload the failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ runner.os }}-shard${{ inputs.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 5
          compression-level: 9
          include-hidden-files: true
          if-no-files-found: ignore
