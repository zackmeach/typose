version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Electron carries Chromium, so its bumps are the security-relevant ones. They get their own PR.
      electron:
        patterns: ['electron']
      npm:
        patterns: ['*']
        exclude-patterns: ['electron']
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: monthly
    ignore:
      # gif 0.14 decodes with weezl 0.1, so 0.2 would put two weezls in the lock. And images.rs charges the GIF
      # prepass's weezl decoder from 0.1's layout (`image_gif_workspace`); 0.2's pre-allocated tables outgrow it.
      # Move with gif, and re-derive that charge.
      - dependency-name: weezl
        versions: ['>= 0.2.0']
      # napi 3.15 keeps a class borrowed until its async task settles (napi-rs#3584), so the Doc methods JS calls while
      # a task is pending (prepare_image, prepare_embedded_image, reload, reload_in_folder, close) fail with "The same
      # native value cannot be borrowed mutably while another borrow is active". The change is in napi 3.15.0, and in
      # napi-derive-backend 6.1.6, a patch, which napi-derive 3.6.13 requires. Hold until those methods take &self
      # (owed after the first tag).
      - dependency-name: napi
        versions: ['>= 3.15.0']
      - dependency-name: napi-derive
        versions: ['>= 3.6.13']
      - dependency-name: napi-derive-backend
        versions: ['>= 6.1.6']
    groups:
      cargo:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
